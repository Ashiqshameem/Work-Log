<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work Log</title>
<style>
:root{
  --bg:#f5f6f3; --surface:#ffffff; --surface-2:#eceee9; --border:#dcded7;
  --text:#1c211d; --text-muted:#5d655e;
  --accent:#3d6b5c; --accent-soft:#e2ede7; --accent-text:#25453a;
  --danger:#a13d3d;
  --cat-1:#b5652d; --cat-2:#3d6b8a; --cat-3:#7a5ea8; --cat-4:#6b6b6b;
  --cat-5:#5c7a3d; --cat-6:#a13d5c; --cat-7:#8a5a3d; --cat-8:#3d5c7a;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141814; --surface:#1b201b; --surface-2:#232922; --border:#333a32;
    --text:#e7ebe4; --text-muted:#9aa39b;
    --accent:#6fae98; --accent-soft:#22332b; --accent-text:#a8d9c6;
    --danger:#d98a8a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141814; --surface:#1b201b; --surface-2:#232922; --border:#333a32;
  --text:#e7ebe4; --text-muted:#9aa39b;
  --accent:#6fae98; --accent-soft:#22332b; --accent-text:#a8d9c6;
  --danger:#d98a8a;
  color-scheme:dark;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,sans-serif;
  font-size:15px; line-height:1.5; padding-inline:16px;
}
h1,h2,h3{font-weight:600; text-wrap:balance; margin:0;}
a{color:var(--accent-text);}
code,.mono{font-family:"Consolas","SFMono-Regular",ui-monospace,monospace;}
.wrap{max-width:880px; margin:0 auto; padding-block:20px 48px;}
.masthead{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:18px;}
.masthead .titles{display:flex; flex-direction:column; gap:2px;}
.masthead .eyebrow{font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-muted); font-weight:600;}
.masthead h1{font-size:26px;}
.iobar{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.iobar input[type=file]{display:none;}
.tabs{display:flex; gap:4px; overflow-x:auto; border-bottom:1px solid var(--border); margin-bottom:20px;}
.tab-btn{
  appearance:none; border:none; background:transparent; color:var(--text-muted);
  font:inherit; font-weight:600; font-size:13.5px; padding:10px 12px; cursor:pointer;
  border-bottom:2px solid transparent; white-space:nowrap;
}
.tab-btn:hover{color:var(--text);}
.tab-btn[aria-selected="true"]{color:var(--accent-text); border-bottom-color:var(--accent);}
.section-head{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px;}
.section-head h2{font-size:19px;}
.head-btns{display:flex; gap:8px; flex-wrap:wrap;}
.btn{
  appearance:none; border:1px solid var(--border); background:var(--surface); color:var(--text);
  font:inherit; font-weight:600; font-size:13.5px; padding:8px 14px; border-radius:7px; cursor:pointer;
}
.btn:hover{border-color:var(--accent);}
.btn:focus-visible, .tab-btn:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px;
}
.btn-sm{padding:6px 10px; font-size:12.5px;}
.btn-primary{background:var(--accent); border-color:var(--accent); color:var(--bg);}
.btn-danger{background:var(--danger); border-color:var(--danger); color:#fff;}
.btn-danger-outline{border-color:var(--danger); color:var(--danger);}
.btn-ghost{border-color:transparent; background:transparent; padding:4px 8px; font-size:12px; color:var(--text-muted);}
.btn-ghost:hover{color:var(--accent-text); border-color:var(--accent);}
.btn-ghost.remove:hover{color:var(--danger); border-color:var(--danger);}
.chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px;}
.chip{
  border:1px solid var(--border); background:var(--surface); color:var(--text-muted);
  font:inherit; font-weight:600; font-size:12.5px; padding:6px 12px; border-radius:999px; cursor:pointer;
  display:inline-flex; align-items:center; gap:6px;
}
.chip .dot{width:8px; height:8px; border-radius:50%; display:inline-block;}
.chip[aria-pressed="true"]{border-color:var(--accent); color:var(--text); background:var(--accent-soft);}
.panel{
  border:1px solid var(--border); background:var(--surface); border-radius:10px; padding:16px;
  margin-bottom:16px;
}
.panel h3{font-size:14px; margin-bottom:12px;}
.panel.danger{border-color:var(--danger);}
.panel.danger h3{color:var(--danger);}
.field{display:flex; flex-direction:column; gap:4px; margin-bottom:12px;}
.field label{font-size:12.5px; font-weight:600; color:var(--text-muted);}
.field input, .field textarea, .field select{
  font:inherit; padding:8px 10px; border:1px solid var(--border); border-radius:6px;
  background:var(--bg); color:var(--text); width:100%;
}
.field textarea{min-height:64px; resize:vertical;}
.form-row{display:flex; gap:10px; flex-wrap:wrap;}
.form-row .field{flex:1 1 200px;}
.form-actions{display:flex; gap:8px; margin-top:4px; flex-wrap:wrap;}
.hint{font-size:12px; color:var(--text-muted); margin-bottom:12px;}
.list{display:flex; flex-direction:column; gap:8px;}
.card{
  border:1px solid var(--border); background:var(--surface); border-radius:9px; padding:12px 14px;
  display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
}
.card-main{min-width:0; flex:1;}
.card-title{font-weight:600; font-size:14.5px; margin-bottom:2px; overflow-wrap:anywhere;}
.card-sub{font-size:12.5px; color:var(--text-muted); display:flex; gap:8px; flex-wrap:wrap; align-items:center; overflow-wrap:anywhere;}
.card-desc{font-size:13px; color:var(--text-muted); margin-top:4px; white-space:pre-wrap;}
.card-actions{display:flex; gap:2px; flex-shrink:0; flex-wrap:wrap; justify-content:flex-end;}
.badge{
  font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; color:#fff; white-space:nowrap;
}
.empty{
  border:1px dashed var(--border); border-radius:10px; padding:28px 16px; text-align:center;
  color:var(--text-muted); font-size:13.5px;
}
.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:22px;}
.stat-tile{border:1px solid var(--border); background:var(--surface); border-radius:10px; padding:14px;}
.stat-tile .n{font-size:26px; font-weight:700; font-variant-numeric:tabular-nums;}
.stat-tile .lbl{font-size:12px; color:var(--text-muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em;}
.bars{display:flex; flex-direction:column; gap:10px; margin-bottom:22px;}
.bar-row{display:flex; align-items:center; gap:10px;}
.bar-row .name{width:70px; font-size:12.5px; color:var(--text-muted); flex-shrink:0;}
.bar-track{flex:1; background:var(--surface-2); border-radius:5px; height:10px; overflow:hidden;}
.bar-fill{height:100%; border-radius:5px; background:var(--accent);}
.bar-row .count{width:24px; text-align:right; font-size:12.5px; font-variant-numeric:tabular-nums; color:var(--text-muted);}
.month-table{width:100%; border-collapse:collapse; font-size:13px; margin-bottom:22px;}
.month-table th, .month-table td{padding:7px 8px; text-align:right; border-bottom:1px solid var(--border);}
.month-table th:first-child, .month-table td:first-child{text-align:left;}
.month-table th{color:var(--text-muted); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em;}
.month-table td{font-variant-numeric:tabular-nums;}
.feed{display:flex; flex-direction:column; gap:2px;}
.feed-item{display:flex; align-items:baseline; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); font-size:13.5px;}
.feed-item:last-child{border-bottom:none;}
.feed-dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
.feed-date{font-size:11.5px; color:var(--text-muted); white-space:nowrap; margin-left:auto; font-variant-numeric:tabular-nums;}
.toast{
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  background:var(--text); color:var(--bg); padding:9px 16px; border-radius:8px; font-size:13px;
  opacity:0; pointer-events:none; transition:opacity .2s ease; max-width:90vw; text-align:center;
}
.toast.show{opacity:1;}
.note{font-size:12px; color:var(--text-muted); margin-bottom:18px;}
@media (max-width:520px){
  .card{flex-direction:column;}
  .card-actions{justify-content:flex-start;}
  .tab-btn{padding:9px 9px; font-size:12.5px;}
  .masthead{flex-direction:column;}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
  "use strict";

  var STORAGE_KEY = "worklog.v1";
  var JIRA_BASE = "https://enverus.atlassian.net/browse/";
  var SECTIONS = ["tickets","confluence","tools","highlights"];
  var CAT_ROTATION = ["var(--cat-1)","var(--cat-2)","var(--cat-3)","var(--cat-4)","var(--cat-5)","var(--cat-6)","var(--cat-7)","var(--cat-8)"];
  var DEFAULT_CATEGORIES = [
    {id:"extract", name:"Extract", color:"var(--cat-1)"},
    {id:"adns", name:"ADNS", color:"var(--cat-2)"},
    {id:"bridge", name:"Bridge", color:"var(--cat-3)"},
    {id:"other", name:"Other", color:"var(--cat-4)"}
  ];

  // Per-section config for the simple (non-ticket) lists.
  var CFG = {
    confluence: {
      title:"Confluence Pages", addLabel:"+ Add page", showLink:true, showDesc:false,
      fields:[
        {key:"title", label:"Page title (optional)", type:"text", placeholder:"e.g. ADNS onboarding guide"},
        {key:"link", label:"Confluence link", type:"text", placeholder:"https://yourteam.atlassian.net/wiki/..."}
      ]
    },
    tools: {
      title:"Tools Created", addLabel:"+ Add tool", showLink:true, showDesc:true,
      fields:[
        {key:"title", label:"Tool name (optional)", type:"text", placeholder:"e.g. Extract log validator"},
        {key:"link", label:"Link (repo, doc, app)", type:"text", placeholder:"optional"},
        {key:"description", label:"What it does", type:"textarea", placeholder:"optional"}
      ]
    },
    highlights: {
      title:"Highlights", addLabel:"+ Add highlight", showLink:false, showDesc:true,
      fields:[
        {key:"title", label:"Title", type:"text", placeholder:"e.g. Cut extract failures 30%"},
        {key:"description", label:"Details", type:"textarea", placeholder:"optional"}
      ]
    }
  };

  // ---------- state ----------
  function copy(o){ return JSON.parse(JSON.stringify(o)); }
  function normalizeState(s){
    if(!s || typeof s !== "object") s = {};
    var out = {};
    SECTIONS.forEach(function(k){ out[k] = Array.isArray(s[k]) ? s[k] : []; });
    out.categories = (Array.isArray(s.categories) && s.categories.length) ? s.categories : copy(DEFAULT_CATEGORIES);
    return out;
  }

  var storageOk = true;
  var state = null;
  var savedRaw = null;
  try{ savedRaw = localStorage.getItem(STORAGE_KEY); }
  catch(e){ storageOk = false; }
  try{ state = normalizeState(savedRaw ? JSON.parse(savedRaw) : null); }
  catch(e){ state = normalizeState(null); }

  var ui = { tab:"overview", ticketFilter:"all", form:null, confirmRemoveAll:false };

  // ---------- helpers ----------
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function nowIso(){ return new Date().toISOString(); }
  function fmtDate(iso){
    try{ return new Date(iso).toLocaleDateString(undefined, {year:"numeric", month:"short", day:"numeric"}); }
    catch(e){ return ""; }
  }
  function monthKey(iso){ return iso ? iso.slice(0,7) : ""; }
  function monthLabel(key){
    var parts = key.split("-");
    var d = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, 1);
    return d.toLocaleDateString(undefined, {year:"numeric", month:"short"});
  }
  function escHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }
  function safeLink(url){
    url = String(url || "").trim();
    if(/^(https?:)?\/\//i.test(url)) return url;
    if(/^[a-z0-9.+-]+:/i.test(url) && !/^javascript:/i.test(url)) return url;
    if(url) return "https://" + url;
    return "#";
  }
  function catById(id){
    for(var i=0;i<state.categories.length;i++){ if(state.categories[i].id===id) return state.categories[i]; }
    return {id:"other", name:"Other", color:"var(--cat-4)"};
  }
  function findById(list, id){
    for(var i=0;i<list.length;i++){ if(list[i].id===id) return list[i]; }
    return null;
  }
  function normalizeTicketEntry(raw){
    raw = String(raw || "").trim();
    if(!raw) return "";
    if(/^https?:\/\//i.test(raw)) return raw;
    if(/^[a-z][a-z0-9]*-\d+$/i.test(raw)) return JIRA_BASE + raw.toUpperCase();
    return raw;
  }
  function isDuplicateTicket(link, excludeId){
    var k = link.toLowerCase();
    return state.tickets.some(function(t){ return t.id !== excludeId && t.link && t.link.toLowerCase() === k; });
  }
  function el(html){
    var t = document.createElement("template");
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }
  function byNewest(a,b){ return (b.createdAt||"").localeCompare(a.createdAt||""); }

  var toastTimer = null;
  function showToast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2800);
  }

  function persist(){
    if(!storageOk) return;
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){ storageOk = false; showToast("Couldn't save — browser storage may be full or blocked. Export a backup."); }
  }

  function setTab(tab){ ui.tab = tab; ui.form = null; ui.confirmRemoveAll = false; render(); }
  function openForm(form){
    ui.form = form; ui.confirmRemoveAll = false; render();
    var p = document.getElementById("entry-form");
    if(p && p.scrollIntoView) p.scrollIntoView({behavior:"smooth", block:"start"});
  }
  function closeForm(){ ui.form = null; render(); }
  function isForm(section, editId){
    return ui.form && ui.form.section === section && (editId === undefined || (ui.form.editId || null) === (editId || null));
  }

  // ---------- backup export / import ----------
  function exportData(){
    var blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "work-log-backup-" + new Date().toISOString().slice(0,10) + ".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    showToast("Backup downloaded.");
  }
  function importData(file){
    var reader = new FileReader();
    reader.onload = function(){
      var parsed;
      try{ parsed = JSON.parse(reader.result); }
      catch(e){ showToast("That file couldn't be read as a backup."); return; }
      if(!parsed || typeof parsed !== "object"){ showToast("That file couldn't be read as a backup."); return; }
      if(!window.confirm("Replace everything in this log with the contents of this backup?")) return;
      var skippedTrainings = Array.isArray(parsed.trainings) ? parsed.trainings.length : 0;
      state = normalizeState(parsed);
      ui.form = null; ui.confirmRemoveAll = false;
      persist(); render();
      showToast(skippedTrainings
        ? "Backup restored. " + skippedTrainings + " training entr" + (skippedTrainings===1?"y was":"ies were") + " skipped (Trainings is no longer tracked)."
        : "Backup restored.");
    };
    reader.readAsText(file);
  }

  // ---------- render ----------
  function render(){
    var app = document.getElementById("app");
    app.innerHTML = "";
    app.appendChild(renderShell());
  }

  var TABS = [
    {id:"overview", label:"Overview"},
    {id:"tickets", label:"Tickets"},
    {id:"confluence", label:"Confluence Pages"},
    {id:"tools", label:"Tools Created"},
    {id:"highlights", label:"Highlights"}
  ];

  function renderShell(){
    var wrap = el('<div class="wrap"></div>');
    var head = el(
      '<div class="masthead">' +
      '<div class="titles"><span class="eyebrow">Personal activity log</span><h1>Work Log</h1></div>' +
      '<div class="iobar">' +
      '<button type="button" class="btn btn-sm" id="io-export">Export backup</button>' +
      '<button type="button" class="btn btn-sm" id="io-import-btn">Import backup</button>' +
      '<input type="file" id="io-import" accept="application/json">' +
      '</div></div>'
    );
    head.querySelector("#io-export").addEventListener("click", exportData);
    var fileInput = head.querySelector("#io-import");
    head.querySelector("#io-import-btn").addEventListener("click", function(){ fileInput.click(); });
    fileInput.addEventListener("change", function(){
      if(fileInput.files && fileInput.files[0]) importData(fileInput.files[0]);
      fileInput.value = "";
    });
    wrap.appendChild(head);

    wrap.appendChild(el(storageOk
      ? '<div class="note">Saved automatically in this browser. Use "Export backup" occasionally, or before switching computers.</div>'
      : '<div class="note">Your browser is blocking local storage, so entries won’t be saved between visits. Use "Export backup" before closing this tab.</div>'));

    var tabs = el('<div class="tabs" role="tablist"></div>');
    TABS.forEach(function(t){
      var b = el('<button type="button" class="tab-btn" role="tab" aria-selected="'+(ui.tab===t.id)+'">'+escHtml(t.label)+'</button>');
      b.addEventListener("click", function(){ setTab(t.id); });
      tabs.appendChild(b);
    });
    wrap.appendChild(tabs);

    var content = el('<div></div>');
    if(ui.tab === "overview") content.appendChild(renderOverview());
    else if(ui.tab === "tickets") content.appendChild(renderTickets());
    else content.appendChild(renderSimpleSection(ui.tab));
    wrap.appendChild(content);
    return wrap;
  }

  // ---------- overview ----------
  function renderOverview(){
    var frag = el('<div></div>');
    var stat = el('<div class="stat-grid"></div>');
    [["Tickets", state.tickets.length],["Confluence pages", state.confluence.length],["Tools created", state.tools.length],["Highlights", state.highlights.length]]
      .forEach(function(pair){
        stat.appendChild(el('<div class="stat-tile"><div class="n">'+pair[1]+'</div><div class="lbl">'+escHtml(pair[0])+'</div></div>'));
      });
    frag.appendChild(stat);

    if(state.tickets.length){
      frag.appendChild(el('<h3 style="margin-bottom:10px;">Tickets by category</h3>'));
      var bars = el('<div class="bars"></div>');
      var max = 0;
      var rows = state.categories.map(function(c){
        var n = state.tickets.filter(function(t){ return t.categoryId===c.id; }).length;
        max = Math.max(max, n);
        return {cat:c, n:n};
      }).filter(function(r){ return r.n > 0; });
      rows.forEach(function(r){
        var pct = max ? Math.round((r.n/max)*100) : 0;
        bars.appendChild(el(
          '<div class="bar-row"><span class="name">'+escHtml(r.cat.name)+'</span>' +
          '<span class="bar-track"><span class="bar-fill" style="width:'+pct+'%; background:'+r.cat.color+';"></span></span>' +
          '<span class="count">'+r.n+'</span></div>'
        ));
      });
      frag.appendChild(bars);
    }

    var months = {};
    function tally(list, key){
      list.forEach(function(item){
        var mk = monthKey(item.createdAt);
        if(!mk) return;
        months[mk] = months[mk] || {tickets:0, confluence:0, tools:0, highlights:0};
        months[mk][key]++;
      });
    }
    tally(state.tickets, "tickets"); tally(state.confluence, "confluence");
    tally(state.tools, "tools"); tally(state.highlights, "highlights");
    var monthKeys = Object.keys(months).sort().reverse().slice(0,6);
    if(monthKeys.length){
      frag.appendChild(el('<h3 style="margin-bottom:10px;">Monthly summary</h3>'));
      var table = el('<table class="month-table"><thead><tr><th>Month</th><th>Tickets</th><th>Confluence</th><th>Tools</th><th>Highlights</th></tr></thead><tbody></tbody></table>');
      var tbody = table.querySelector("tbody");
      monthKeys.forEach(function(mk){
        var m = months[mk];
        tbody.appendChild(el('<tr><td>'+escHtml(monthLabel(mk))+'</td><td>'+m.tickets+'</td><td>'+m.confluence+'</td><td>'+m.tools+'</td><td>'+m.highlights+'</td></tr>'));
      });
      frag.appendChild(table);
    }

    var all = []
      .concat(state.tickets.map(function(t){ return {type:"Ticket", title:t.title || t.link || "Untitled ticket", createdAt:t.createdAt, color:catById(t.categoryId).color}; }))
      .concat(state.confluence.map(function(t){ return {type:"Confluence", title:t.title || t.link || "Untitled page", createdAt:t.createdAt, color:"var(--cat-3)"}; }))
      .concat(state.tools.map(function(t){ return {type:"Tool", title:t.title || t.link || "Untitled tool", createdAt:t.createdAt, color:"var(--cat-5)"}; }))
      .concat(state.highlights.map(function(t){ return {type:"Highlight", title:t.title || "Untitled highlight", createdAt:t.createdAt, color:"var(--cat-6)"}; }));
    all.sort(byNewest);
    all = all.slice(0,8);
    frag.appendChild(el('<h3 style="margin-bottom:10px;">Recent activity</h3>'));
    if(all.length){
      var feed = el('<div class="feed"></div>');
      all.forEach(function(it){
        feed.appendChild(el(
          '<div class="feed-item"><span class="feed-dot" style="background:'+it.color+';"></span>' +
          '<span>'+escHtml(it.type)+' &middot; '+escHtml(it.title)+'</span>' +
          '<span class="feed-date">'+fmtDate(it.createdAt)+'</span></div>'
        ));
      });
      frag.appendChild(feed);
    } else {
      frag.appendChild(el('<div class="empty">Nothing logged yet. Add a ticket, page, tool or highlight from the tabs above and it will show up here.</div>'));
    }
    return frag;
  }

  // ---------- tickets ----------
  function renderTickets(){
    var frag = el('<div></div>');
    var shown = state.tickets.filter(function(t){ return ui.ticketFilter==="all" || t.categoryId===ui.ticketFilter; });
    shown.sort(byNewest);

    var head = el('<div class="section-head"><h2>Tickets</h2></div>');
    var btns = el('<div class="head-btns"></div>');
    var addBtn = el('<button type="button" class="btn btn-primary">+ Add ticket</button>');
    addBtn.addEventListener("click", function(){
      if(isForm("tickets", null)) closeForm(); else openForm({section:"tickets", editId:null});
    });
    btns.appendChild(addBtn);
    if(shown.length){
      var removeAllBtn = el('<button type="button" class="btn btn-sm btn-danger-outline">Remove all ('+shown.length+')</button>');
      removeAllBtn.addEventListener("click", function(){ ui.confirmRemoveAll = !ui.confirmRemoveAll; ui.form = null; render(); });
      btns.appendChild(removeAllBtn);
    }
    head.appendChild(btns);
    frag.appendChild(head);

    if(ui.form && ui.form.section === "tickets"){ frag.appendChild(ticketForm(ui.form.editId)); }

    var chips = el('<div class="chips"></div>');
    var allChip = el('<button type="button" class="chip" aria-pressed="'+(ui.ticketFilter==="all")+'">All</button>');
    allChip.addEventListener("click", function(){ ui.ticketFilter = "all"; ui.confirmRemoveAll = false; render(); });
    chips.appendChild(allChip);
    state.categories.forEach(function(c){
      var chip = el('<button type="button" class="chip" aria-pressed="'+(ui.ticketFilter===c.id)+'"><span class="dot" style="background:'+c.color+';"></span>'+escHtml(c.name)+'</button>');
      chip.addEventListener("click", function(){ ui.ticketFilter = c.id; ui.confirmRemoveAll = false; render(); });
      chips.appendChild(chip);
    });
    var addCatChip = el('<button type="button" class="chip" style="border-style:dashed;">+ New category</button>');
    addCatChip.addEventListener("click", function(){
      if(ui.form && ui.form.section === "category") closeForm(); else openForm({section:"category", editId:null});
    });
    chips.appendChild(addCatChip);
    frag.appendChild(chips);

    if(ui.form && ui.form.section === "category"){ frag.appendChild(categoryForm()); }

    if(ui.confirmRemoveAll && shown.length){
      var catName = ui.ticketFilter === "all" ? "all categories" : catById(ui.ticketFilter).name;
      var confirmPanel = el(
        '<div class="panel danger" id="entry-form">' +
        '<h3>Remove '+shown.length+' ticket'+(shown.length===1?'':'s')+' in '+escHtml(catName)+'?</h3>' +
        '<div class="hint">This can’t be undone.</div>' +
        '<div class="form-actions">' +
        '<button type="button" class="btn btn-danger" id="ra-yes">Yes, remove all</button>' +
        '<button type="button" class="btn" id="ra-cancel">Cancel</button>' +
        '</div></div>'
      );
      confirmPanel.querySelector("#ra-yes").addEventListener("click", function(){
        var ids = {};
        shown.forEach(function(t){ ids[t.id] = true; });
        state.tickets = state.tickets.filter(function(t){ return !ids[t.id]; });
        ui.confirmRemoveAll = false;
        render(); persist();
      });
      confirmPanel.querySelector("#ra-cancel").addEventListener("click", function(){ ui.confirmRemoveAll = false; render(); });
      frag.appendChild(confirmPanel);
    }

    if(!shown.length){
      frag.appendChild(el('<div class="empty">No tickets logged yet'+(ui.ticketFilter!=="all" ? " in this category" : "")+'.</div>'));
    } else {
      var list = el('<div class="list"></div>');
      shown.forEach(function(t){ list.appendChild(ticketCard(t)); });
      frag.appendChild(list);
    }
    return frag;
  }

  function fillCategories(sel, selectedId){
    state.categories.forEach(function(c){
      var o = document.createElement("option");
      o.value = c.id; o.textContent = c.name;
      sel.appendChild(o);
    });
    sel.value = selectedId;
  }

  function ticketForm(editId){
    var existing = editId ? findById(state.tickets, editId) : null;
    if(editId && !existing){ ui.form = null; return el('<div></div>'); }

    if(existing){
      // Edit one ticket.
      var pe = el(
        '<div class="panel" id="entry-form"><h3>Edit ticket</h3>' +
        '<div class="form-row">' +
        '<div class="field"><label for="tf-cat">Category</label><select id="tf-cat"></select></div>' +
        '<div class="field"><label for="tf-link">Ticket link or key</label><input id="tf-link" type="text" placeholder="HDTR-32324 or a full link"></div>' +
        '</div>' +
        '<div class="field"><label for="tf-title">Title (optional)</label><input id="tf-title" type="text" placeholder="optional"></div>' +
        '<div class="form-actions"><button type="button" class="btn btn-primary" id="tf-save">Save changes</button>' +
        '<button type="button" class="btn" id="tf-cancel">Cancel</button></div></div>'
      );
      fillCategories(pe.querySelector("#tf-cat"), existing.categoryId);
      pe.querySelector("#tf-link").value = existing.link || "";
      pe.querySelector("#tf-title").value = existing.title || "";
      pe.querySelector("#tf-save").addEventListener("click", function(){
        var link = normalizeTicketEntry(pe.querySelector("#tf-link").value);
        var title = pe.querySelector("#tf-title").value.trim();
        if(!link && !title){ pe.querySelector("#tf-link").focus(); return; }
        if(link && isDuplicateTicket(link, existing.id)){ showToast("That ticket is already logged."); return; }
        existing.categoryId = pe.querySelector("#tf-cat").value;
        existing.link = link;
        existing.title = title;
        ui.form = null; render(); persist();
        showToast("Ticket updated.");
      });
      pe.querySelector("#tf-cancel").addEventListener("click", closeForm);
      return pe;
    }

    // Add one or many tickets.
    var p = el(
      '<div class="panel" id="entry-form"><h3>New ticket</h3>' +
      '<div class="field"><label for="tf-cat">Category</label><select id="tf-cat"></select></div>' +
      '<div class="field"><label for="tf-link">Ticket link(s) or key(s)</label>' +
      '<textarea id="tf-link" placeholder="HDTR-32324 or a full link"></textarea>' +
      '<div class="hint" style="margin:4px 0 0;">Paste several at once, one per line or separated by commas. A bare key like HDTR-32324 becomes '+escHtml(JIRA_BASE)+'HDTR-32324. Duplicates are skipped.</div></div>' +
      '<div class="field"><label for="tf-title">Title (optional — ignored when adding multiple links)</label><input id="tf-title" type="text" placeholder="optional"></div>' +
      '<div class="form-actions"><button type="button" class="btn btn-primary" id="tf-save">Save ticket</button>' +
      '<button type="button" class="btn" id="tf-cancel">Cancel</button></div></div>'
    );
    fillCategories(p.querySelector("#tf-cat"), ui.ticketFilter !== "all" ? ui.ticketFilter : state.categories[0].id);
    p.querySelector("#tf-save").addEventListener("click", function(){
      var raw = p.querySelector("#tf-link").value;
      var title = p.querySelector("#tf-title").value.trim();
      var categoryId = p.querySelector("#tf-cat").value;
      var links = raw.split(/[,\n]+/).map(normalizeTicketEntry).filter(function(s){ return s.length > 0; });
      if(!links.length && !title){ p.querySelector("#tf-link").focus(); return; }

      var seenNow = {}, fresh = [], skipped = 0;
      links.forEach(function(link){
        var k = link.toLowerCase();
        if(seenNow[k] || isDuplicateTicket(link, null)){ skipped++; return; }
        seenNow[k] = true;
        fresh.push(link);
      });

      var added = 0;
      if(!links.length){
        state.tickets.push({id:uid(), categoryId:categoryId, title:title, link:"", createdAt:nowIso()});
        added = 1;
      } else if(links.length === 1){
        if(fresh.length){
          state.tickets.push({id:uid(), categoryId:categoryId, title:title, link:fresh[0], createdAt:nowIso()});
          added = 1;
        }
      } else {
        var stamp = nowIso();
        fresh.forEach(function(link){
          state.tickets.push({id:uid(), categoryId:categoryId, title:"", link:link, createdAt:stamp});
        });
        added = fresh.length;
      }

      var msg = added ? "Added " + added + " ticket" + (added===1?"":"s") + "." : "";
      if(skipped) msg += (msg ? " " : "") + "Skipped " + skipped + " duplicate" + (skipped===1?"":"s") + ".";
      if(!msg) msg = "Nothing added.";
      ui.form = null; render(); persist();
      showToast(msg);
    });
    p.querySelector("#tf-cancel").addEventListener("click", closeForm);
    return p;
  }

  function categoryForm(){
    var p = el(
      '<div class="panel" id="entry-form"><h3>New category</h3>' +
      '<div class="field"><label for="cf-name">Category name</label><input id="cf-name" type="text" placeholder="e.g. Ingestion"></div>' +
      '<div class="form-actions"><button type="button" class="btn btn-primary" id="cf-save">Add category</button>' +
      '<button type="button" class="btn" id="cf-cancel">Cancel</button></div></div>'
    );
    p.querySelector("#cf-save").addEventListener("click", function(){
      var name = p.querySelector("#cf-name").value.trim();
      if(!name){ p.querySelector("#cf-name").focus(); return; }
      var id = name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") || uid();
      if(state.categories.some(function(c){ return c.id===id; })) id = id + "-" + uid().slice(0,4);
      state.categories.push({id:id, name:name, color:CAT_ROTATION[state.categories.length % CAT_ROTATION.length]});
      ui.form = null; render(); persist();
    });
    p.querySelector("#cf-cancel").addEventListener("click", closeForm);
    return p;
  }

  function ticketCard(t){
    var c = catById(t.categoryId);
    var linkAnchor = t.link ? '<a class="mono" href="'+escHtml(safeLink(t.link))+'" target="_blank" rel="noopener noreferrer">'+escHtml(t.link)+'</a>' : "";
    var titleHtml = t.title ? escHtml(t.title) : (linkAnchor || '<em>Untitled ticket</em>');
    var subLink = (t.title && linkAnchor) ? linkAnchor : "";
    var card = el(
      '<div class="card"><div class="card-main">' +
      '<div class="card-title">'+titleHtml+'</div>' +
      '<div class="card-sub"><span class="badge" style="background:'+c.color+';">'+escHtml(c.name)+'</span>' +
      (subLink ? '<span>'+subLink+'</span>' : '') +
      '<span>'+fmtDate(t.createdAt)+'</span></div>' +
      '</div></div>'
    );
    card.appendChild(actionButtons(
      function(){ openForm({section:"tickets", editId:t.id}); },
      function(){
        state.tickets = state.tickets.filter(function(x){ return x.id !== t.id; });
        if(ui.form && ui.form.editId === t.id) ui.form = null;
        render(); persist();
      }
    ));
    return card;
  }

  // ---------- generic lists (confluence / tools / highlights) ----------
  function actionButtons(onEdit, onRemove){
    var wrap = el('<div class="card-actions"><button type="button" class="btn btn-ghost" data-act="edit">Edit</button><button type="button" class="btn btn-ghost remove" data-act="remove">Remove</button></div>');
    wrap.querySelector('[data-act="edit"]').addEventListener("click", onEdit);
    wrap.querySelector('[data-act="remove"]').addEventListener("click", onRemove);
    return wrap;
  }

  function renderSimpleSection(key){
    var cfg = CFG[key];
    var frag = el('<div></div>');
    var head = el('<div class="section-head"><h2>'+escHtml(cfg.title)+'</h2></div>');
    var addBtn = el('<button type="button" class="btn btn-primary">'+escHtml(cfg.addLabel)+'</button>');
    addBtn.addEventListener("click", function(){
      if(isForm(key, null)) closeForm(); else openForm({section:key, editId:null});
    });
    head.appendChild(addBtn);
    frag.appendChild(head);

    if(ui.form && ui.form.section === key){ frag.appendChild(simpleForm(key, ui.form.editId)); }

    var items = state[key].slice().sort(byNewest);
    if(!items.length){
      frag.appendChild(el('<div class="empty">Nothing here yet. Use "'+escHtml(cfg.addLabel)+'" to log your first entry.</div>'));
    } else {
      var list = el('<div class="list"></div>');
      items.forEach(function(item){ list.appendChild(itemCard(key, item)); });
      frag.appendChild(list);
    }
    return frag;
  }

  function itemCard(key, item){
    var cfg = CFG[key];
    var title = item.title || item.link || (key==="highlights" ? "Untitled highlight" : "Untitled");
    var linkHtml = (cfg.showLink && item.link) ? '<a href="'+escHtml(safeLink(item.link))+'" target="_blank" rel="noopener noreferrer">'+escHtml(item.link)+'</a>' : "";
    var sub = (linkHtml ? '<span>'+linkHtml+'</span>' : "") + '<span>'+fmtDate(item.createdAt)+'</span>';
    var card = el(
      '<div class="card"><div class="card-main">' +
      '<div class="card-title">'+escHtml(title)+'</div>' +
      '<div class="card-sub">'+sub+'</div>' +
      (cfg.showDesc && item.description ? '<div class="card-desc">'+escHtml(item.description)+'</div>' : '') +
      '</div></div>'
    );
    card.appendChild(actionButtons(
      function(){ openForm({section:key, editId:item.id}); },
      function(){
        state[key] = state[key].filter(function(x){ return x.id !== item.id; });
        if(ui.form && ui.form.editId === item.id) ui.form = null;
        render(); persist();
      }
    ));
    return card;
  }

  function simpleForm(key, editId){
    var cfg = CFG[key];
    var existing = editId ? findById(state[key], editId) : null;
    if(editId && !existing){ ui.form = null; return el('<div></div>'); }

    var idp = "sf-" + key + "-";
    var html = '<div class="panel" id="entry-form"><h3>'+(existing ? "Edit entry" : "New entry")+'</h3>';
    cfg.fields.forEach(function(f){
      html += '<div class="field"><label for="'+idp+f.key+'">'+escHtml(f.label)+'</label>';
      html += f.type === "textarea"
        ? '<textarea id="'+idp+f.key+'" placeholder="'+escHtml(f.placeholder||"")+'"></textarea>'
        : '<input id="'+idp+f.key+'" type="text" placeholder="'+escHtml(f.placeholder||"")+'">';
      html += '</div>';
    });
    html += '<div class="form-actions"><button type="button" class="btn btn-primary" id="'+idp+'save">'+(existing ? "Save changes" : "Save")+'</button>' +
      '<button type="button" class="btn" id="'+idp+'cancel">Cancel</button></div></div>';
    var p = el(html);

    if(existing){
      cfg.fields.forEach(function(f){ p.querySelector("#"+idp+f.key).value = existing[f.key] || ""; });
    }

    p.querySelector("#"+idp+"save").addEventListener("click", function(){
      var values = {}, any = false;
      cfg.fields.forEach(function(f){
        var v = p.querySelector("#"+idp+f.key).value.trim();
        values[f.key] = v;
        if(v) any = true;
      });
      if(!any){ p.querySelector("#"+idp+cfg.fields[0].key).focus(); return; }
      if(existing){
        cfg.fields.forEach(function(f){ existing[f.key] = values[f.key]; });
        showToast("Entry updated.");
      } else {
        var entry = {id:uid(), createdAt:nowIso()};
        cfg.fields.forEach(function(f){ entry[f.key] = values[f.key]; });
        state[key].push(entry);
      }
      ui.form = null; render(); persist();
    });
    p.querySelector("#"+idp+"cancel").addEventListener("click", closeForm);
    return p;
  }

  render();
})();
</script>
</body>
</html>
